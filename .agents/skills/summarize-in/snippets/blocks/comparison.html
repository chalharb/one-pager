<!-- snippet
name: comparison
use: Two to four options against the same criteria.
fits: full width (above the shell, between rows, or directory section.span)
limit: 2-4 options, 3-7 criteria
notes: Rows are criteria; cells are short: a word, a number, a phrase.
-->
  <div class="wide">
    <table class="compare">
      <thead><tr><th></th><th>{{OPTION_A}}</th><th>{{OPTION_B}}</th></tr></thead>
      <tr><td>{{CRITERION}}</td><td>{{A}}</td><td>{{B}}</td></tr>
    </table>
  </div>
